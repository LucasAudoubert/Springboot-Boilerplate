services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATABASE_URL:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/dbname

volumes:
  pg_data: